<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>عناية سامي | التطبيق</title>
<script>
if(new URLSearchParams(location.search).get('view')==='booking'){
 document.documentElement.classList.add('booking-view');
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'SamiBrand';src:url('assets/sami-brand.otf') format('opentype');font-display:swap}
:root{
  --org:#CE9234; --org-d:#A6741F; --org-soft:#F6E7C8;
  --ink:#221F1F; --mute:#8A7B6C; --soft:#B3A594;
  --bg:#FBFAF6; --card:#FFFFFF; --line:rgba(140,110,80,.16);
  --dark:#1B140D; --dark2:#241B10; --gold:#E8BE6C; --gold-d:#CE9234;
  --green:#2E8B57;
  --ease:cubic-bezier(.33,.9,.35,1); --dur:.25s;
  --fd:'Noto Kufi Arabic',serif; --fb:'Readex Pro',sans-serif; --brand:'SamiBrand','Noto Kufi Arabic',serif;
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:var(--fb);background:#F4F2EC;color:var(--ink);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--org);color:#fff}
.app{max-width:430px;margin-inline:auto;min-height:100dvh;background:var(--bg);position:relative;
  box-shadow:0 0 60px rgba(60,40,20,.25)}
/* ===== الهيدر ===== */
/* الهيدر بدون أي خلفية — المحتوى بيمر من ورا الشريط مباشرة.
   ملاحظة: بقى position:relative بدل sticky، فمفيش شريط ثابت يحتاج خلفية
   تفصله عن المحتوى، وبالتالي مفيش اللون الرمادي اللي كان بيظهر ويختفي. */
.hd{position:sticky;top:0;z-index:300;background:transparent;backdrop-filter:none;border-bottom:0;transition:none}
.app{position:relative}
.hd .in{display:flex;align-items:center;gap:6px;padding:10px 12px;min-height:68px}
.hd .bell{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.hd .bell .bdg{position:absolute;top:2px;left:2px;min-width:17px;height:17px;border-radius:9px;background:var(--org);
  color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding-inline:4px}
.hd .logo{flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--ink);min-width:max-content}
.hd .logo img,.hd .logo small{display:none!important}
.hd .logo b{font-family:var(--brand);font-weight:400;font-size:24px;line-height:1;white-space:nowrap;display:block;overflow:visible}
.hd .loc{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 10px;flex:1 1 110px;min-width:0;max-width:132px}
.hd .loc span{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .loc svg{color:var(--org)}
.hd .burger{width:42px;height:42px;display:grid;place-items:center;color:var(--ink)}
.hd .header-cart{position:relative;border-radius:50%}.hd .header-cart .cart-count{position:absolute;top:0;right:0;min-width:17px;height:17px;padding-inline:4px;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--org));color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;box-shadow:0 5px 11px -7px rgba(95,53,5,.8);transition:transform .25s var(--ease)}.hd .header-cart .cart-count.hide{display:none}.hd .header-cart .cart-count.pop{transform:scale(1.3)}
@media(max-width:350px){.hd .in{gap:4px;padding-inline:8px}.hd .logo b{font-size:22px}.hd .loc{gap:3px;padding-inline:7px;max-width:100px}}
.hexa{width:34px;height:34px}
.app.home-shell .hd{position:fixed;top:0;left:50%;right:auto;transform:translateX(-50%);width:min(430px,100%);z-index:305;background:transparent;backdrop-filter:none;border-bottom-color:transparent;transition:background .25s ease,border-color .25s ease,box-shadow .25s ease}
.app.home-shell .hd.scrolled{background:transparent;backdrop-filter:none;border-bottom-color:transparent;box-shadow:none}
.app.home-shell .hd .in{padding-top:calc(12px + env(safe-area-inset-top))}
.app.home-shell .hd .bell,.app.home-shell .hd .burger{color:#F9E9C5;background:rgba(255,255,255,.08);border:1px solid rgba(232,190,108,.24);backdrop-filter:blur(10px);box-shadow:0 12px 24px -18px rgba(0,0,0,.7)}
.app.home-shell .hd .bell .bdg{background:linear-gradient(135deg,var(--gold),var(--org));color:#1B140D}
.app.home-shell .hd .logo{color:#fff;text-shadow:0 8px 22px rgba(0,0,0,.55)}
.app.home-shell .hd .loc{color:#F9E9C5;background:rgba(255,255,255,.08);border-color:rgba(232,190,108,.24);backdrop-filter:blur(10px);box-shadow:0 12px 24px -18px rgba(0,0,0,.7)}
.app.home-shell .hd .loc svg{color:#F4D48E}
/* ===== شريط التنقل السفلي ===== */
.tabbar-wrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:calc(100% - 18px);max-width:412px;z-index:320}
.booking-view .tabbar-wrap,.booking-active .tabbar-wrap{display:none!important}
.booking-active .tabbar-logo-float{display:none!important}
.tabbar{position:relative;
  background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border:1px solid rgba(206,146,52,.18);border-radius:26px 26px 0 0;
  box-shadow:0 -12px 34px -22px rgba(64,39,12,.52);display:grid;grid-template-columns:repeat(5,1fr);padding:3px 5px calc(4px + env(safe-area-inset-bottom));direction:ltr;
  -webkit-mask-image:radial-gradient(circle 42px at 50% 0%,transparent 99%,#fff 100%);
  mask-image:radial-gradient(circle 42px at 50% 0%,transparent 99%,#fff 100%)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 4px;font-size:9.5px;color:var(--soft);
  min-height:36px;border-radius:11px;transition:color var(--dur);direction:rtl}
.tab svg{width:20px;height:20px;transition:transform .25s var(--ease)}
.tab.on{color:var(--org);font-weight:700}
.tab.on svg{transform:translateY(-2px)}
.tab-book{position:relative;z-index:2;color:var(--org)!important;font-family:var(--fd);font-weight:800}
.book-logo-spacer{width:68px;height:30px;display:block}
.tabbar-logo-float{position:absolute;top:-35px;left:50%;transform:translateX(-50%);z-index:2;
  width:68px;height:68px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(145deg,#18120C,#050403);border:3px solid #E5B654;box-shadow:0 12px 30px -10px rgba(102,62,13,.62)}
.tabbar-logo-float img{width:41px;height:50px;object-fit:contain}
.tab-book b{font-size:11.5px;margin-top:3px;color:var(--org-d)}
.tab .tbdg{position:absolute;margin-top:-4px;margin-inline-start:20px;min-width:16px;height:16px;border-radius:8px;
  background:var(--org);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding-inline:4px;
  transition:transform .3s var(--ease)}
.tab .tbdg.hide{display:none}
.tab .tbdg.pop{transform:scale(1.35)}
/* ===== عناصر عامة ===== */
.screen{display:none;padding-bottom:72px;animation:scrIn .35s var(--ease)}
.screen.on{display:block}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* داخل رحلة الحجز الشاشة يعاد رسمها بعد كل اختيار؛ منع الحركة العامة هنا يمنع القفزة لأعلى. */
html.booking-active{scroll-behavior:auto!important}
html.booking-active .screen,
html.booking-active .screen.on{animation:none!important;transform:none!important}
.sec{padding:18px 16px 4px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sec-h h2{font-family:var(--fd);font-weight:700;font-size:16.5px;color:var(--ink);display:flex;gap:8px;align-items:center}
.sec-h h2 .hi{color:var(--org)}
.sec-h a{font-size:12px;color:var(--org);font-weight:700;display:flex;gap:5px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:12px 24px;
  border-radius:14px;font-size:13.5px;font-weight:700;transition:transform var(--dur) var(--ease),box-shadow var(--dur),opacity var(--dur)}
.btn:active{transform:scale(.97)}
.btn-org{background:var(--org);color:#fff;box-shadow:0 10px 22px -10px rgba(206,146,52,.55)}
.btn-org:hover{box-shadow:0 14px 26px -10px rgba(206,146,52,.6)}
.btn-line{border:1.5px solid var(--org);color:var(--org);background:rgba(255,255,255,.9)}
.btn-lite{border:1px solid var(--line);color:var(--ink);background:#fff}
.btn-w{border:1.5px solid rgba(255,255,255,.85);color:#fff;background:rgba(255,255,255,.08);backdrop-filter:blur(4px)}
.btn:disabled{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 10px 24px -18px rgba(90,60,30,.25)}
/* سلايدر أفقي RTL بسناب */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding:2px 16px 14px;scroll-padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:#D9CFC0;transition:all .3s var(--ease)}
.dots i.on{width:20px;background:var(--org)}
/* توست */
.toast{position:fixed;bottom:104px;right:50%;transform:translate(50%,16px);z-index:400;opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:12.5px;font-weight:600;
  display:flex;gap:8px;align-items:center;transition:all .35s var(--ease);max-width:88%;text-align:center;
  box-shadow:0 16px 34px -12px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(50%,0)}
.toast .ti{width:20px;height:20px;border-radius:50%;background:var(--org);display:grid;place-items:center;flex:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== محاكي خطوات الحجز للموبايل ===== */
.wiz-container { display: flex; flex-direction: column; min-height: calc(100vh - 140px); background: var(--bg); padding: 16px; animation: scrIn .3s var(--ease); }
.wiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.wiz-close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: #fff; border: 1px solid var(--line); }
.wiz-title { font-family: var(--fd); font-weight: 700; font-size: 15px; color: var(--ink); }
.wiz-step-num { font-size: 12px; font-weight: 700; color: var(--org); }
.wiz-progress { height: 4px; background: rgba(140,110,80,.1); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
.wiz-progress-bar { height: 100%; background: var(--org); transition: width .3s var(--ease); }
.wiz-content { flex: 1; display: flex; flex-direction: column; gap: 16px; margin-bottom: 70px; }
.wiz-footer { position: fixed; bottom: 0; right: 50%; transform: translateX(50%); width: 100%; max-width: 430px; z-index: 310;
  background: #fff; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; }

/* كروت الفروع في الموبايل */
.w-br-card { display: flex; align-items: center; gap: 12px; padding: 14px; background: #fff; border: 1.5px solid var(--line); border-radius: 16px; cursor: pointer; transition: all .25s var(--ease); }
.w-br-card.sel { border-color: var(--org); background: var(--org-soft); }
.w-br-ic { width: 40px; height: 40px; border-radius: 12px; background: rgba(206,146,52,.1); color: var(--org); display: grid; place-items: center; }
.w-br-info { flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: right; }
.w-br-info b { font-size: 13.5px; color: var(--ink); }
.w-br-info small { font-size: 11px; color: var(--mute); }

/* الموظفين */
.w-emps-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.w-emp-card { padding: 16px; background: #fff; border: 1.5px solid var(--line); border-radius: 16px; text-align: center; cursor: pointer; transition: all .25s var(--ease); }
.w-emp-card.sel { border-color: var(--org); background: var(--org-soft); }
.w-emp-card .av { width: 44px; height: 44px; border-radius: 50%; background: var(--org); color: #fff; font-size: 16px; font-weight: 700; display: grid; place-items: center; margin: 0 auto 8px; }
.w-emp-card b { font-size: 13px; display: block; color: var(--ink); }

/* الأوقات والتواريخ */
.w-dates-track { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
.w-date-chip { flex: 0 0 64px; height: 74px; border-radius: 14px; background: #fff; border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
.w-date-chip.sel { border-color: var(--org); background: var(--org-soft); color: var(--org-d); }
.w-date-chip span { font-size: 10px; color: var(--mute); }
.w-date-chip b { font-size: 16px; }

.w-slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 180px; overflow-y: auto; padding: 4px; }
.w-slot { height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font-size: 12.5px; font-weight: 700; display: grid; place-items: center; cursor: pointer; }
.w-slot.sel { border-color: var(--org); background: var(--org); color: #fff; }

/* خطة الجلسة المنسقة (الموبايل) */
.w-plan-track { display: flex; flex-direction: column; gap: 8px; position: relative; padding-right: 18px; margin-top: 10px; }
.w-plan-track::before { content: ""; position: absolute; top: 8px; bottom: 8px; right: 8px; width: 1.5px; background: var(--org); }
.w-plan-item { position: relative; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; margin-right: 10px; text-align: right; }
.w-plan-item::before { content: ""; position: absolute; top: 50%; right: -23px; width: 8px; height: 8px; border-radius: 50%; background: var(--org-d); transform: translateY(-50%); border: 1.5px solid #fff; }
.w-plan-item.break::before { background: var(--org); width: 10px; height: 10px; right: -24px; }
.w-plan-item b { font-size: 12px; display: block; }
.w-plan-item small { font-size: 10.5px; color: var(--mute); display: block; }
.w-plan-item .t { font-size: 11px; font-weight: 700; margin-top: 4px; display: block; }

/* الدفع */
.w-pay-card { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: #fff; border: 1.5px solid var(--line); border-radius: 16px; cursor: pointer; }
.w-pay-card.sel { border-color: var(--org); background: var(--org-soft); }
.w-pay-card span { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13.5px; }

/* الإهداء */
.w-gift-toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; }
.w-switch { width: 44px; height: 24px; border-radius: 12px; background: #D9CFC0; position: relative; cursor: pointer; transition: background .3s; }
.w-switch::after { content: ""; position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .3s; }
.w-switch.on { background: var(--green); }
.w-switch.on::after { transform: translateX(-20px); }
.w-gift-fields { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: rgba(140,110,80,.05); border-radius: 14px; }
.w-gift-fields input { border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13px; width: 100%; outline: none; background: #fff; }

/* ===== حجز موعد مطابق للموقع لكن بصياغة تطبيق موبايل ===== */
.m-book{min-height:calc(100dvh - 68px);background:linear-gradient(180deg,#FBFAF6 0%,#F3F1EA 100%);padding:14px 14px 96px}
.m-book-head{position:sticky;top:67px;z-index:60;margin:-14px -14px 14px;padding:12px 14px;background:rgba(247,243,238,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.share-btn{display:inline-flex;align-items:center;gap:5px;margin-inline-start:auto;padding:5px 10px;border-radius:999px;
  border:1px solid rgba(198,161,91,.45);background:transparent;color:var(--gold,#c6a15b);cursor:pointer;
  font-family:inherit;font-size:11px;font-weight:700;line-height:1}
.share-btn svg{flex:none}
.share-btn:active{background:rgba(198,161,91,.14)}

.hd .lang{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid rgba(23,19,14,.16);
  border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;line-height:1;padding:0}
.hd .lang b{font-size:11px;font-weight:800;letter-spacing:.2px}
.hd .lang svg{display:none}
.hd .lang:active{background:rgba(23,19,14,.06)}

/* ===================================================================
   الصفحات الفرعية: الباقات والخدمات المنزلية
   =================================================================== */

/* الهيدر يقعد فوق صورة الهيرو بدل الشريط الرمادي */
.app.hero-shell .hd{display:none}
.app.hero-shell .hd .in{padding-top:calc(12px + env(safe-area-inset-top))}
.app.hero-shell .hd .bell,.app.hero-shell .hd .burger,.app.hero-shell .hd .lang{color:#F9E9C5;
  background:rgba(255,255,255,.08);border:1px solid rgba(232,190,108,.24);backdrop-filter:blur(10px)}
.app.hero-shell .hd .logo{color:#fff;text-shadow:0 8px 22px rgba(0,0,0,.55)}
.app.hero-shell .hd .loc{color:#F9E9C5;background:rgba(255,255,255,.08);border-color:rgba(232,190,108,.24);backdrop-filter:blur(10px)}
.app.hero-shell .hd .loc svg{color:#F4D48E}
/* زر اللغة يتماشى مع الهيدر الشفاف على الرئيسية كمان */
.app.home-shell .hd .lang{color:#F9E9C5;background:rgba(255,255,255,.08);border-color:rgba(232,190,108,.24);backdrop-filter:blur(10px)}

/* الهيرو الفرعي يبدأ من أعلى الشاشة تحت الهيدر الشفاف */
.sub-hero .top{padding-top:calc(14px + env(safe-area-inset-top))}

/* ===== الباقات ===== */
.pk-list{display:flex;flex-direction:column;gap:16px;padding:14px 16px 24px}

/* كرت الباقة: صورة بانورامية، شريط لون الباقة، ومحتوى مرتّب */
.pk-list .pk-card{position:relative;width:100%;display:flex;flex-direction:column;overflow:hidden;border-radius:22px;background:#fff;
  border:1px solid var(--line);box-shadow:0 22px 44px -30px rgba(60,42,12,.65);
  animation:fadeUp .45s ease both}
.pk-list .pk-card::before{content:"";position:absolute;z-index:3;inset-inline:0;top:0;height:4px;
  background:linear-gradient(90deg,var(--pk,var(--gold)),transparent 85%)}
.pk-list .pk-img{position:relative;height:164px;overflow:hidden}
.pk-list .pk-img img{transition:transform .6s var(--ease)}
.pk-list .pk-card:active .pk-img img{transform:scale(1.04)}
.pk-list .pk-hot{position:absolute;z-index:2;top:10px;inset-inline-end:10px;padding:4px 10px;border-radius:999px;
  background:linear-gradient(135deg,var(--gold),var(--org));color:#fff;font-size:10px;font-weight:800}
.pk-list .pk-dur{position:absolute;z-index:2;bottom:10px;inset-inline-end:10px;display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font-size:10px;font-weight:700}
.pk-list .pk-empty{padding:40px 16px;text-align:center;font-size:12px;color:var(--mute)}
.pk-list .pk-img img{width:100%;height:100%;object-fit:cover;display:block}
.pk-list .pk-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(9,7,5,.72))}
.pk-list .pk-cnt{position:absolute;z-index:2;bottom:10px;inset-inline-start:12px;padding:4px 11px;border-radius:999px;
  background:rgba(255,255,255,.92);color:var(--ink);font-size:10.5px;font-weight:800}
.pk-list .pk-body{padding:15px 16px 17px}
.pk-list .pk-body h3{display:flex;align-items:center;gap:9px;margin:0 0 6px;font-family:var(--fd);font-size:17px;color:var(--ink)}
.pk-list .pk-ic{width:32px;height:32px;flex:none;border-radius:11px;display:grid;place-items:center;

.w-design-card.ramadan,.w-gift-preview-card.ramadan { background: radial-gradient(circle at 20% 10%,rgba(232,190,108,.26),transparent 32%),linear-gradient(135deg,#12122A,#26316B 55%,#C99B3B); color:#F8E7B0; }

footer{background:radial-gradient(circle at 18% 0,rgba(232,190,108,.16),transparent 30%),linear-gradient(180deg,#0B0906,#050403);color:#f5efe4;padding:58px 24px 20px;border-top:1px solid rgba(198,161,91,.28)}

.pay span{min-height:46px;border-radius:14px;display:grid;place-items:center;border:1px solid rgba(232,190,108,.3);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 32px -24px rgba(0,0,0,.9);color:#f7d995;font-size:0;font-weight:900;letter-spacing:0;position:relative;overflow:hidden}
.pay span::before{font-size:13px;line-height:1;color:inherit}.pay span::after{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.08);border-radius:10px;pointer-events:none}
.pay span:nth-child(1)::before{content:"VISA";font-style:italic;font-size:15px;color:#fff}.pay span:nth-child(2)::before{content:"MC";font-size:14px;color:#111;background:linear-gradient(90deg,#EB001B 0 50%,#F79E1B 50%);width:38px;height:24px;border-radius:999px;display:grid;place-items:center}.pay span:nth-child(3)::before{content:"مدى";font-size:16px;color:#9FE7C1}.pay span:nth-child(4)::before{content:"tabby";font-size:14px;color:#B8F7D0}.pay span:nth-child(5)::before{content:" Pay";font-size:15px;color:#fff}

  z-index:310;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 18px 40px -14px rgba(60,35,15,.35);transition:transform .4s var(--ease);overflow:hidden}
.bookbar.on{transform:translate(50%,0)}
.bookbar .main{display:flex;align-items:center;gap:10px;padding:10px 12px}
.bookbar .bthumb{width:46px;height:46px;border-radius:12px;overflow:hidden;flex:none;background:#211A12}
.bookbar .bthumb img{width:100%;height:100%;object-fit:cover}
.bookbar .binf{flex:1;min-width:0}
.bookbar .binf b{font-family:var(--fd);font-size:12.5px;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookbar .binf small{font-size:10px;color:var(--mute)}
.bookbar .tot{text-align:center;flex:none}
.bookbar .tot small{font-size:9px;color:var(--mute);display:block}
.bookbar .tot b{font-family:var(--fd);font-size:16px;color:var(--org)}
.bookbar .go{min-height:44px;padding:10px 18px;font-size:12.5px;border-radius:12px;flex:none}
.bookbar .exp{max-height:0;opacity:0;overflow:hidden;transition:max-height .35s var(--ease),opacity .3s;border-top:1px dashed var(--line)}
.bookbar.open .exp{max-height:170px;opacity:1}
.bookbar .exp .rowx{display:flex;justify-content:space-between;padding:8px 16px;font-size:11px;color:#4E4436}
.bookbar .exp .rowx:first-child{padding-top:12px}
.bookbar .exp .rowx b{color:var(--org)}
.bookbar .chev{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mute);flex:none;transition:transform .3s}
.bookbar.open .chev{transform:rotate(180deg)}
/* ===== المتجر / السلة / حجوزاتي / حسابي ===== */
.pg-head{padding:20px 16px 4px}
.pg-head h1{font-family:var(--fd);font-size:21px;font-weight:800;color:var(--ink)}
.pg-head p{font-size:12px;color:var(--mute);margin-top:5px}
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:14px 16px}
.store-grid .prod-m{width:auto}
.store-page{padding-bottom:84px}
.store-hero{position:relative;height:clamp(106px,29vw,125px);min-height:106px;margin:10px 12px 20px;border-radius:8px;overflow:hidden;background:#efe5d8;box-shadow:0 12px 28px -24px rgba(35,22,8,.55)}
.store-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:none}
.store-hero::before,.store-hero::after,.store-hero .shine{display:none}
.store-hero .copy{position:absolute;z-index:2;inset:0 0 0 auto;width:44%;max-width:none;min-height:0;margin:0;padding:12px 13px 8px;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;color:var(--ink);direction:rtl;text-align:right;background:transparent;border:0;box-shadow:none}
.store-hero small{display:block;font-family:var(--fb);font-size:4.8px;line-height:1.25;font-weight:700;color:#b77a1d;margin:0 0 3px;background:transparent;border:0;border-radius:0;padding:0;backdrop-filter:none;white-space:nowrap}
.store-hero h1{font-family:var(--fb);font-size:13.2px;line-height:1.2;font-weight:700;max-width:none;color:#1d1813;text-shadow:none;white-space:nowrap}
.store-hero p{font-family:var(--fb);font-size:5.7px;color:#5f554b;line-height:1.55;margin:5px 0 6px;max-width:22ch}
.store-hero .btn{align-self:flex-start;min-height:19px;padding:3px 9px;font-family:var(--fb);font-size:6.1px;font-weight:600;border:1px solid rgba(151,96,21,.3);border-radius:999px;background:rgba(255,255,255,.68);color:#6b4b1d;box-shadow:none;white-space:nowrap}
.store-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 16px 12px}
.store-section-head h2{font-family:var(--fd);font-size:20px;color:var(--ink);position:relative}
.store-section-head h2::after{content:"";position:absolute;right:0;bottom:-5px;width:28px;height:2px;background:var(--org);border-radius:2px}
.store-section-head a{font-size:11px;color:var(--org);font-weight:800;display:flex;align-items:center;gap:5px}
.store-cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 16px 18px}
.store-cats::-webkit-scrollbar{display:none}
.store-cat{flex:0 0 128px;min-height:76px;border-radius:17px;border:1px solid var(--line);background:#fff;display:grid;
  grid-template-columns:46px 1fr;gap:9px;align-items:center;padding:9px;text-align:right;box-shadow:0 16px 28px -26px rgba(75,45,16,.55)}
.store-cat img{width:46px;height:46px;border-radius:13px;object-fit:cover;background:#F1E9DA}
.store-cat b{font-family:var(--fd);font-size:11.5px;color:var(--ink);line-height:1.45}
.store-cat small{display:block;font-size:9.5px;color:var(--org);margin-top:3px}
.store-cat.sel{border-color:var(--org);background:#FFF9EE;box-shadow:0 18px 30px -24px rgba(206,146,52,.75)}
.store-grid.lux{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px 16px}
.store-grid.lux .prod-m{width:auto;border-radius:18px;box-shadow:0 18px 34px -28px rgba(55,34,13,.55)}
.store-grid.lux .prod-m .pim{aspect-ratio:1/1;background:#17110B}
.store-grid.lux .prod-m .pb{text-align:right;padding:11px 10px 12px}
.store-grid.lux .prod-m .pb b{font-size:12.5px;line-height:1.45;min-height:36px}
.store-grid.lux .prod-m .fv,.store-grid.lux .prod-m .ad{width:29px;height:29px;top:8px}
.store-grid.lux .prod-m .fv{left:8px}
.store-grid.lux .prod-m .ad{right:8px}
.prod-m .desc{font-size:10px;color:var(--mute);line-height:1.55;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}
.prod-m .act-row{display:grid;gap:8px;margin-top:9px}
.prod-m .act-row .pr{margin-top:0;justify-content:flex-start;font-size:14px}
.prod-m .cart-pill{width:100%;min-height:32px;border:1.5px solid var(--org);border-radius:999px;color:var(--org);font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:all .25s var(--ease)}
.prod-m .cart-pill.added{background:linear-gradient(135deg,#1E6B41,#2E8B57);border-color:transparent;color:#fff}
.store-benefits{margin:2px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.store-benefit{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;display:flex;gap:10px;align-items:center;box-shadow:0 16px 28px -26px rgba(75,45,16,.5)}
.store-benefit i{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;color:var(--org);background:#FFF6E8;border:1px solid rgba(206,146,52,.18);flex:none}
.store-benefit b{font-family:var(--fd);font-size:11.5px;color:var(--ink);display:block}
.store-benefit small{font-size:9.5px;color:var(--mute);display:block;margin-top:3px;line-height:1.4}
.citem{margin:0 16px 10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px;display:flex;gap:11px;align-items:center;animation:scrIn .3s var(--ease) both}
.citem .cim{width:56px;height:56px;border-radius:12px;overflow:hidden;flex:none;background:linear-gradient(150deg,#F0E8DA,#E7DCC9)}
.citem .cim img{width:100%;height:100%;object-fit:cover}
.citem .cin2{flex:1;min-width:0}
.citem .cin2 b{font-family:var(--fd);font-size:12.5px;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .cin2 .p{font-size:12px;color:var(--org);font-weight:800;margin-top:3px;display:block}
.qty{display:flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;direction:ltr;background:#fff}
.qty button{width:30px;height:30px;display:grid;place-items:center;color:var(--org);font-weight:800;font-size:15px}
.qty span{min-width:26px;text-align:center;font-size:12.5px;font-weight:700}
.citem .del{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#B3452F;flex:none}
.cart-foot{margin:8px 16px 0;padding:16px}
.fulfill-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.fulfill-opt{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1.5px solid var(--line);
  border-radius:12px;font-size:11.5px;font-weight:600;color:var(--ink);background:#fff;position:relative}
.fulfill-opt.sel{border-color:var(--org);background:rgba(206,146,52,.08);color:var(--org)}
.fulfill-opt[disabled],.fulfill-opt.disabled{opacity:.5;color:var(--mute)}
.fulfill-opt small{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--org);color:#fff;
  font-size:7.5px;font-weight:700;border-radius:8px;padding:1px 6px}
.cart-foot .r{display:flex;justify-content:space-between;font-size:12px;color:#4E4436;padding:5px 0}
.cart-foot .r.t{border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;font-weight:800;color:var(--ink);font-size:13.5px}
.cart-foot .r.t b{font-family:var(--fd);font-size:18px;color:var(--org)}
.empty{padding:60px 30px;text-align:center;color:var(--mute)}
.empty .ei2{width:72px;height:72px;margin:0 auto 16px;border-radius:50%;background:#fff;border:1.5px dashed var(--line);
  display:grid;place-items:center;color:var(--org)}
.empty b{font-family:var(--fd);font-size:15px;color:var(--ink);display:block;margin-bottom:6px}
.empty p{font-size:12px;line-height:1.8}
.bk-item{margin:0 16px 12px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;animation:scrIn .3s var(--ease) both}
.bk-item .bh{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px dashed var(--line)}
.bk-item .bh .bic{width:44px;height:44px;border-radius:13px;background:var(--org-soft);color:var(--org);display:grid;place-items:center;flex:none}
.bk-item .bh b{font-family:var(--fd);font-size:14px;color:var(--ink);display:block}
.bk-item .bh small{font-size:10.5px;color:var(--mute)}
.bk-item .bh .st{margin-inline-start:auto;font-size:10px;font-weight:700;color:var(--green);background:#EAF5EC;border-radius:999px;padding:5px 11px}
.bk-item .bb2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;font-size:11px;color:#4E4436}
.bk-item .bb2 span{display:flex;gap:6px;align-items:center}
.bk-item .bb2 svg{color:var(--org);flex:none}
.acc-hero{margin:16px;padding:18px;display:flex;gap:14px;align-items:center;border-radius:20px;color:#EDE3D2;
  background:linear-gradient(140deg,#241B10,#140E08);border:1px solid rgba(233,207,142,.25)}
.acc-hero .av2{width:58px;height:58px;border-radius:50%;background:linear-gradient(140deg,var(--org),#8F5E12);color:#fff;
  display:grid;place-items:center;font-family:var(--fd);font-size:20px;font-weight:800;flex:none}
.acc-hero b{font-family:var(--fd);font-size:16px;display:block}
.acc-hero small{font-size:11px;color:#B9AC97;display:block;margin-top:3px}
.acc-hero .pts{margin-inline-start:auto;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(233,207,142,.25);border-radius:13px;padding:9px 13px}
.acc-hero .pts b{color:var(--gold);font-size:16px}
.acc-hero .pts small{font-size:8.5px}
.received-gift-card{margin:14px 16px;background:linear-gradient(145deg,#171008,#2B1F10);border:1px solid rgba(232,190,108,.34);border-radius:20px;padding:15px;display:grid;grid-template-columns:58px 1fr auto;gap:13px;align-items:center;color:#F4E6C8;box-shadow:0 18px 36px -24px rgba(30,18,6,.7),inset 0 1px 0 rgba(255,255,255,.08)}
.received-gift-card .gi{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;color:#171008;background:linear-gradient(135deg,var(--gold),var(--gold-b));box-shadow:0 14px 24px -14px rgba(232,190,108,.8)}
.received-gift-card b{font-family:var(--fd);font-size:15px;color:#fff;display:block}
.received-gift-card small{display:block;color:#C8B996;font-size:11px;line-height:1.7;margin-top:3px}
.received-gift-card .arr{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(232,190,108,.3);color:var(--gold)}
.received-gift-card:active{transform:scale(.985)}
.menu-l{margin:0 16px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.menu-l button{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;font-size:13px;font-weight:600;color:var(--ink);
  border-bottom:1px solid var(--line);min-height:50px}
.menu-l button:last-child{border:none}
.menu-l .mi{width:38px;height:38px;border-radius:11px;background:var(--bg);color:var(--org);display:grid;place-items:center;flex:none}
.menu-l .ar{margin-inline-start:auto;color:var(--soft)}

/* ===== تحديثات العميل لواجهة الموبايل ===== */
.hslide{height:clamp(410px,58svh,520px);min-height:0;max-height:none}
.hslide .hin{padding:82px 22px 26px}
.hslide h1{font-size:clamp(26px,7.6vw,33px)}
.hslide p{margin-top:8px;line-height:1.75}
.hslide .disc{margin:11px 0 14px}
.hero-dots{bottom:14px}
.cafe-slide{margin:8px 16px 5px;height:222px;border-radius:22px;overflow:hidden;position:relative;background:#17110c;border:1px solid rgba(206,146,52,.28);box-shadow:0 22px 42px -30px rgba(48,28,9,.72);cursor:pointer}
.cafe-slide>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.97) contrast(1.02)}
.cafe-slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,4,3,.42) 0%,rgba(5,4,3,.28) 26%,rgba(5,4,3,.12) 47%,rgba(5,4,3,0) 69%)}
.cafe-slide .cafe-in{position:absolute;z-index:2;inset-block:0;left:17px;width:31%;height:100%;padding:73px 0 12px;color:#fff;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:right;direction:rtl}
.cafe-slide h3{width:100%;font-family:var(--fb);font-weight:700;line-height:1.48;letter-spacing:-.18px;text-align:right;text-shadow:0 2px 7px rgba(0,0,0,.5)}
.cafe-slide h3 b,.cafe-slide h3 span{display:block;white-space:nowrap}.cafe-slide h3 b{color:var(--gold);font-size:15.5px;text-align:center}.cafe-slide h3 span{font-size:13.2px;text-align:right}
.cafe-slide p{width:100%;font-family:var(--fb);font-size:7px;font-weight:400;line-height:1.68;color:rgba(255,255,255,.9);margin:7px 0 9px;text-align:right;text-shadow:0 1px 5px rgba(0,0,0,.58)}
.cafe-qr{align-self:flex-end;display:inline-flex;flex-direction:row;align-items:center;justify-content:center;gap:3px;min-height:21px;padding:4px 6px;border:1px solid rgba(232,190,108,.72);border-radius:999px;color:#f3d183;background:rgba(8,6,4,.18);font-family:var(--fb);font-size:5.3px;font-weight:600;white-space:nowrap;backdrop-filter:blur(2px)}
.cafe-qr .qr-mark{width:9px;height:9px;border:1px solid currentColor;border-radius:2px;display:block;background:linear-gradient(90deg,currentColor 1px,transparent 1px) 0 0/3px 3px,linear-gradient(currentColor 1px,transparent 1px) 0 0/3px 3px;opacity:.95}
.home-svc-heading{padding:15px 16px 7px}.home-svc-heading .sec-h{margin-bottom:0}.home-svc-heading .sec-h h2{font-family:var(--fb);font-size:11.2px;font-weight:600;gap:5px}.home-svc-heading .sec-h h2 svg{width:11px;height:11px}
.home-svc{margin:0 16px;border-radius:17px;background:#fbf7f0;border:0;box-shadow:0 18px 34px -29px rgba(65,38,12,.5)}
.home-svc .row{height:164px;min-height:164px;direction:ltr;position:relative;overflow:hidden;background:#b69678 url('assets/extracted/home-service-continuous.webp') center/cover no-repeat}.home-svc .txt{width:54%;flex:none;padding:16px 12px 12px;position:relative;z-index:3;display:flex;flex-direction:column;align-items:stretch;direction:rtl;text-align:right;background:transparent;border:0;box-shadow:none}.home-svc .im{display:none}
.home-svc h3{font-family:var(--fb);font-size:11.2px;font-weight:700;line-height:1.75;white-space:nowrap;letter-spacing:-.15px;position:relative;left:-30px}.home-svc p{font-size:8.5px;line-height:1.65;margin:3px 0 28px;color:#685d53;position:relative;left:-30px}.home-svc .chips{gap:3px;flex-wrap:nowrap;margin-bottom:20px;direction:rtl}.home-svc .chip{font-size:6.1px;font-weight:600;padding:4px 4px;gap:2px;white-space:nowrap;background:#fff;border-color:rgba(162,106,62,.17)}.home-svc .chip svg{width:8px;height:8px;color:#b64a2b}
.home-svc .btn{width:126px;min-height:34px!important;margin-right:auto;margin-left:0;padding:7px 9px!important;font-size:9.2px!important;border-radius:7px;background:linear-gradient(135deg,#b94725,#dc6c35);box-shadow:0 9px 18px -13px rgba(151,57,24,.75);position:relative;left:5px}
.product-heading{padding-bottom:10px}.product-heading .sec-h h2,.related-heading .sec-h h2{font-size:17px}.related-heading{padding-top:23px;padding-bottom:10px}.related-heading .sec-h h2::after{content:'✦';color:var(--org);font-size:13px;margin-inline-start:5px}
.featured-product{margin:0 16px 12px;border-radius:22px;overflow:hidden;background-color:#f2e9e1;background-image:linear-gradient(90deg,rgba(242,233,225,0) 29%,rgba(242,233,225,.12) 37%,rgba(242,233,225,.58) 47%,#f2e9e1 57%,#f5ece5 100%),url('assets/products/featured-moisturizer-reference.webp');background-repeat:no-repeat;background-position:center,left center;background-size:100% 100%,51% 100%;border:1px solid rgba(166,116,31,.22);display:grid;grid-template-columns:51% 49%;aspect-ratio:1.5;min-height:258px;box-shadow:0 24px 48px -34px rgba(63,38,14,.75);position:relative;direction:ltr}
.featured-product::after{display:none}.featured-product .fpic{position:relative;background:transparent}.featured-product .fpic::after{display:none}.featured-product .fpic img{opacity:0;width:100%;height:100%}.featured-product .badge,.featured-product .pdots{display:none}

const BOOKING_SESSION_KEY='sami:active-booking:v1';
function saveBookingSession(){
 try{
  if(!S.bookWizard){sessionStorage.removeItem(BOOKING_SESSION_KEY);return}
  sessionStorage.setItem(BOOKING_SESSION_KEY,JSON.stringify({
   active:true,step:S.bookStep,branch:S.bookBranch,
   services:[...S.bookServices],openCats:[...S.bookOpenCats],
   mode:S.bookMode,emp:S.bookEmp,date:S.bookDate?.toISOString?.()||null,
   time:S.bookTime,pay:S.bookPay
  }));
 }catch(_){}
}
function restoreBookingSession(){
 try{
  const saved=JSON.parse(sessionStorage.getItem(BOOKING_SESSION_KEY)||'null');
  if(!saved?.active)return;
  S.tab='home';S.svPage=false;S.bookLaunch=false;S.bookWizard=true;S.bookDone=false;
  S.bookStep=Math.max(2,Math.min(6,Number(saved.step)||2));
  S.bookBranch=saved.branch||S.currentBranch||'bg';
  S.currentBranch=S.bookBranch;
  S.bookServices=new Set(Array.isArray(saved.services)?saved.services:[]);
  S.bookOpenCats=new Set(Array.isArray(saved.openCats)?saved.openCats:[]);
  S.bookMode=saved.mode||null;S.bookEmp=saved.emp&&typeof saved.emp==='object'?saved.emp:{};
  S.bookDate=saved.date?new Date(saved.date):null;S.bookTime=saved.time??null;S.bookPay=saved.pay||null;
 }catch(_){sessionStorage.removeItem(BOOKING_SESSION_KEY)}
}

function bindBookingServiceSheet(){
 const overlay=$('#bookingServiceOverlay');
 const sheet=$('.booking-service-sheet');
 const scrim=$('#bookingServiceScrim');
 if(!overlay||!sheet)return;
 scrim?.addEventListener('click',dismissBookingServiceSheet);
 let startY=0,lastY=0,startAt=0,tracking=false;
 const reset=()=>{
  tracking=false;
  sheet.classList.remove('dragging');
  sheet.style.transform='';
  if(scrim)scrim.style.opacity='';
 };
 sheet.addEventListener('touchstart',event=>{
  const target=event.target;
  const safeDragZone=target.closest('.booking-sheet-grab')||
   (target.closest('.m-book-head')&&!target.closest('button,a,input,textarea,select,[role="button"]'));
  if(!safeDragZone||sheet.scrollTop>0||event.touches.length!==1)return;
  startY=lastY=event.touches[0].clientY;startAt=performance.now();tracking=true;
  sheet.classList.add('dragging');
 },{passive:true});
 sheet.addEventListener('touchmove',event=>{
  if(!tracking)return;
  const y=event.touches[0].clientY,delta=Math.max(0,y-startY);
  if(delta<=0)return;
  lastY=y;event.preventDefault();
  const eased=Math.min(delta,window.innerHeight*.62);
  sheet.style.transform=`translateY(${eased}px)`;
  if(scrim)scrim.style.opacity=String(Math.max(.08,1-eased/(window.innerHeight*.72)));
 },{passive:false});
 sheet.addEventListener('touchend',()=>{
  if(!tracking)return;
  const delta=Math.max(0,lastY-startY);
  const velocity=delta/Math.max(1,performance.now()-startAt);
  if(delta>92||velocity>.62){reset();dismissBookingServiceSheet()}
  else{
   sheet.classList.remove('dragging');
   sheet.style.transition='transform .34s var(--ease)';
   sheet.style.transform='translateY(0)';
   if(scrim){scrim.style.transition='opacity .3s ease';scrim.style.opacity='1'}
   setTimeout(()=>{sheet.style.transition='';sheet.style.transform='';if(scrim){scrim.style.transition='';scrim.style.opacity=''}},350);
   tracking=false;
  }
 },{passive:true});
 sheet.addEventListener('touchcancel',reset,{passive:true});
}

/* ================= محاكي حجز الموعد التفاعلي الكامل للموبايل (خطوات الموقع الـ 6) ================= */
function getWizDays() {
  const arr = [];
  const start = new Date(2026, 6, 9); // يوليو 9، 2026
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    arr.push(d);
  }
  return arr;
}
function getWizSlots() {
  const arr = [];
  for (let h = 9; h < 24; h++) {
    arr.push({ t: h * 60, s: `${h > 12 ? h - 12 : h}:00 ${h >= 12 ? 'م' : 'ص'}` });
    arr.push({ t: h * 60 + 30, s: `${h > 12 ? h - 12 : h}:30 ${h >= 12 ? 'م' : 'ص'}` });
  }
  return arr;
}
function wizTotalDur() {
  const cut = CUTS.find(c => c.id === S.bookCut);
  if (!cut) return 0;
  let dur = cut.dur;
  S.bookExtras.forEach(() => dur += 20); // 20 دقيقة لكل إضافة
  const totalItems = 1 + S.bookExtras.size;
  if (totalItems > 1) {
    dur += (totalItems - 1) * 15; // 15 دقيقة استراحة بين الخدمات
  }
  return dur;
}
function fmtWizTime(t) {
  const h = Math.floor(t / 60) % 24;
  const m = t % 60;
  const ap = h >= 12 ? 'م' : 'ص';
  const displayH = h % 12 === 0 ? 12 : h % 12;
  return `${displayH}:${m === 0 ? '00' : m} ${ap}`;
}
function wizBuildSession(startTime) {
  const items = [];
  let curr = startTime;
  const cut = CUTS.find(c => c.id === S.bookCut);
  if (cut) {
    items.push({ name: cut.n, start: curr, end: curr + cut.dur, isBreak: false, emp: S.bookEmployee || 'أبو الوفا' });
    curr += cut.dur;
  }
  const exs = [...S.bookExtras].map(id => EXTRAS.find(e => e.id === id));
  exs.forEach((e, idx) => {
    items.push({ name: 'استراحة وراحة للعميل والموظف', start: curr, end: curr + 15, isBreak: true });
    curr += 15;
    items.push({ name: e.n, start: curr, end: curr + 20, isBreak: false, emp: EMPLOYEES[idx % EMPLOYEES.length].n });
    curr += 20;
  });
  return { items, end: curr };
}

function render(){

 const scr=$('#screens');
 const appShell=document.querySelector('.app');
 const serviceSheet=isBookingServiceSheet();
 let html='';
 if(S.giftWizard)html=giftWizardHTML();
 else if(S.bookWizard)html=serviceSheet?'<div class="booking-underlay" aria-hidden="true"></div>'+wizardHTML():wizardHTML();
 else if(S.bookLaunch)html='<div class="booking-underlay booking-launch-underlay" aria-hidden="true"></div>';
 else if(S.tab==='home')html=S.subPage==='services'?allServicesHTML():S.subPage==='pkg'?packagesHTML():S.subPage==='hsv'?homeSvcHTML():S.subPage==='gift'?giftsPageHTML():S.svPage?serviceHTML():homeHTML();
 else if(S.tab==='store')html=storeHTML();
 else if(S.tab==='cart')html=cartHTML();
 else if(S.tab==='bookings')html=bookingsHTML();
 else html=accountHTML();
 if(appShell){
  appShell.classList.toggle('home-shell',S.tab==='home'&&!S.svPage&&!S.subPage&&!S.bookWizard&&!S.giftWizard);
  /* الصفحات اللي ليها صورة هيرو: الهيدر يقعد فوق الصورة بدل الشريط الرمادي */
  appShell.classList.toggle('hero-shell',S.tab==='home'&&(S.svPage||!!S.subPage)&&!S.bookWizard&&!S.giftWizard);
  /* الإهداء بياخد booking-shell كمان عشان كل أنماط واجهة الحجز تنطبق عليه حرفيًا */
  appShell.classList.toggle('booking-shell',!!S.bookWizard||!!S.giftWizard);
  appShell.classList.toggle('gift-shell',!!S.giftWizard);
  appShell.classList.toggle('booking-service-overlay-shell',serviceSheet);
 }
 document.body.classList.toggle('booking-service-sheet-open',serviceSheet);

/* نحافظ على التصميم والتفاعل الداخلي مع مزامنة رابط Vue الخارجي */
const parentPathByGo={
 home:'/',services:'/services',book:'/booking',store:'/store',gift:'/gifts',
 packages:'/packages-gifts',branches:'/branches',account:'/contact'
};
const parentPathByTab={home:'/',store:'/store',bookings:'/booking',account:'/contact'};
const parentPathByFile={
 'app.html':'/','index.html':'/','booking.html':'/booking','store.html':'/store',
 'packages-gifts.html':'/packages-gifts','gifts.html':'/gifts',
 'branches.html':'/branches','contact.html':'/contact'
};
function navigateParent(path){
 if(window.parent===window)return false;
 window.parent.postMessage({type:'sami:navigate',path},'*');
 return true;
}
document.addEventListener('click',e=>{
 if(window.parent===window)return;
 /* Booking controls are entirely internal; never let them become host navigation. */
 if(S.bookWizard&&e.target.closest('#bookingServiceOverlay,.booking-stage,.m-footer,.m-book-head'))return;
 const close=e.target.closest('#giftCancelBtn,#giftDoneHome,#wizCancelBtn,#wizDoneHome');
 if(close){navigateParent('/');return;}
 const goEl=e.target.closest('[data-go]');
 if(goEl&&parentPathByGo[goEl.dataset.go])navigateParent(parentPathByGo[goEl.dataset.go]);
 const tabEl=e.target.closest('.tab[data-tab]');
 if(tabEl&&parentPathByTab[tabEl.dataset.tab])navigateParent(parentPathByTab[tabEl.dataset.tab]);
 const urlEl=e.target.closest('[data-go-url]');
 if(urlEl){
  e.preventDefault();e.stopImmediatePropagation();
  navigateParent('/gift-recipient?ref='+encodeURIComponent(S.giftRef||''));
  return;
 }
 const link=e.target.closest('a[href]');
 if(!link)return;
 const href=link.getAttribute('href')||'';
 const file=href.split('#')[0].split('?')[0];
 let path=parentPathByFile[file];
 if(href==='index.html#services')path='/services';
 if(path){e.preventDefault();e.stopImmediatePropagation();navigateParent(path);}
},true);
syncBranchHeader();
render();

<script>
/* ===== تصفّح ملء الشاشة =====
   يخفي شريط المتصفح عند أول لمسة، ويعيد ضبط الارتفاع مع تغيّر حجم النافذة. */
(function(){
  var setVH = function(){
    document.documentElement.style.setProperty('--app-vh', window.innerHeight + 'px');
  };
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', function(){ setTimeout(setVH, 250); });

  /* ملاحظة: مفيش استدعاء لـ Fullscreen API هنا عن قصد — كان بيتفعّل عند أول
     ضغطة في أي مكان ويخطف التفاعل. ملء الشاشة بقى عن طريق القياسات فقط. */
  document.documentElement.style.overscrollBehavior = 'none';
})();

/* ===== مشاركة / ادعُ صديق =====
   يستخدم مشاركة النظام لو متاحة، وإلا ينسخ الرابط. */
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('.share-btn');
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  var what = b.getAttribute('data-share') || 'عناية سامي';
  var data = {
    title: 'عناية سامي',
    text: 'جرّب ' + what + ' من عناية سامي',
    url: location.href
  };
  if (navigator.share) { navigator.share(data).catch(function(){}); return; }
  var done = function(){
    var old = b.innerHTML; b.innerHTML = 'تم نسخ الرابط';
    setTimeout(function(){ b.innerHTML = old; }, 1600);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(data.url).then(done).catch(function(){});
  else done();
});

/* ===== تغيير اللغة =====
   يبدّل lang/dir ويخزّن الاختيار. نصوص الشاشات لسه عربية —
   ده الأساس اللي تتبني عليه الترجمة لاحقًا. */
(function(){
  var KEY = 'samiMobileLang';
  var btn = document.getElementById('langBtn');
  var lbl = document.getElementById('langLabel');
  if (!btn) return;
  var get = function(){ try { return localStorage.getItem(KEY) === 'en' ? 'en' : 'ar'; } catch(e){ return 'ar'; } };
  var apply = function(l){
    document.documentElement.setAttribute('lang', l);
    document.documentElement.setAttribute('dir', l === 'en' ? 'ltr' : 'rtl');
    if (lbl) lbl.textContent = l === 'ar' ? 'EN' : 'ع';
    btn.title = l === 'ar' ? 'English' : 'العربية';
    try { localStorage.setItem(KEY, l); } catch(e){}
  };
  apply(get());
  btn.addEventListener('click', function(){ apply(get() === 'ar' ? 'en' : 'ar'); });
})();
</script>
